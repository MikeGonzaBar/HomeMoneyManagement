services:
  postgres:
    hostname: postgres
    container_name: money-management-postgres
    build: ./docker/postgres
    image: homemoneymanagement-postgres:15.18-alpine3.23-gosu
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-moneymanagement}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.max=10000", "-c", "pg_stat_statements.track=top"]

  money-management-api:
    hostname: money-management-api
    container_name: money-management-api
    build: ./API
    image: homemoneymanagement-money-management-api
    environment: &api-environment
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-moneymanagement}"
      POSTGRES_DB: "${POSTGRES_DB:-moneymanagement}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DB_CONN_MAX_AGE: "${DB_CONN_MAX_AGE:-60}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-4}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-2}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-180}"
      SECRET_KEY: "${SECRET_KEY:-django-insecure-local-docker-key}"
      DEBUG: "${DEBUG:-True}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
      CORS_ALLOW_ALL_ORIGINS: "${CORS_ALLOW_ALL_ORIGINS:-False}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      API_DOCS_ENABLED: "${API_DOCS_ENABLED:-True}"
      DJANGO_SUPERUSER_USERNAME: "${DJANGO_SUPERUSER_USERNAME:-admin}"
      DJANGO_SUPERUSER_EMAIL: "${DJANGO_SUPERUSER_EMAIL:-admin@example.com}"
      DJANGO_SUPERUSER_PASSWORD: "${DJANGO_SUPERUSER_PASSWORD:-admin123}"
      GOOGLE_AI_API_KEY: "${GOOGLE_AI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_AI_MODEL: "${GOOGLE_AI_MODEL:-gemini-3.8-flash}"
      GOOGLE_AI_FALLBACK_MODELS: "${GOOGLE_AI_FALLBACK_MODELS:-gemini-3.5-flash-lite}"
      GOOGLE_AI_TRANSIENT_RETRIES: "${GOOGLE_AI_TRANSIENT_RETRIES:-0}"
      GOOGLE_AI_REQUEST_TIMEOUT: "${GOOGLE_AI_REQUEST_TIMEOUT:-120}"
      BANK_STATEMENT_MAX_AUTO_RETRIES: "${BANK_STATEMENT_MAX_AUTO_RETRIES:-3}"
      BANK_STATEMENT_RETRY_BASE_SECONDS: "${BANK_STATEMENT_RETRY_BASE_SECONDS:-60}"
      BANK_STATEMENT_RETRY_MAX_SECONDS: "${BANK_STATEMENT_RETRY_MAX_SECONDS:-3600}"
      BANK_STATEMENT_DB_RETRY_MAX_SECONDS: "${BANK_STATEMENT_DB_RETRY_MAX_SECONDS:-30}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    command: bash -c "python /HomeMoneyManagement/manage.py migrate && python /HomeMoneyManagement/create_superuser.py && gunicorn --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-4} --threads ${GUNICORN_THREADS:-2} --timeout ${GUNICORN_TIMEOUT:-180} --access-logfile - --error-logfile - MoneyManagement.wsgi:application"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - media_files:/HomeMoneyManagement/media
    depends_on:
      postgres:
        condition: service_healthy

  money-management-worker:
    hostname: money-management-worker
    container_name: money-management-worker
    image: homemoneymanagement-money-management-api
    restart: unless-stopped
    environment: *api-environment
    command: python /HomeMoneyManagement/manage.py process_bank_statements --poll-interval 2
    volumes:
      - media_files:/HomeMoneyManagement/media
    depends_on:
      postgres:
        condition: service_healthy
      money-management-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python /HomeMoneyManagement/manage.py check --database default >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3

  money-management-ui:
    hostname: money-management-ui
    container_name: money-management-ui
    build:
      context: ./UI/home-money-management
      args:
        # Vite bakes VITE_* values into the JS bundle at build time, so
        # the Brandfetch client ID must be a build arg, not a runtime
        # env var (the final image is just nginx serving static files).
        # Substituted from the repo-root .env (gitignored) or the shell.
        VITE_BRANDFETCH_CLIENT_ID: ${VITE_BRANDFETCH_CLIENT_ID:-}
    ports:
      - "${UI_HOST_PORT:-8080}:80"
    depends_on:
      - money-management-api

volumes:
  postgres_data:
  media_files:
