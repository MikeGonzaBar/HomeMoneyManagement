services:
  postgres:
    hostname: postgres
    container_name: money-management-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-moneymanagement}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  money-management-api:
    hostname: money-management-api
    container_name: money-management-api
    build: ./API
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-moneymanagement}"
      POSTGRES_DB: "${POSTGRES_DB:-moneymanagement}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SECRET_KEY: "${SECRET_KEY:-django-insecure-local-docker-key}"
      DEBUG: "${DEBUG:-True}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
      CORS_ALLOW_ALL_ORIGINS: "${CORS_ALLOW_ALL_ORIGINS:-False}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      GOOGLE_AI_API_KEY: "${GOOGLE_AI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_AI_MODEL: "${GOOGLE_AI_MODEL:-gemini-2.5-flash}"
    command: bash -c "python /HomeMoneyManagement/manage.py migrate && python /HomeMoneyManagement/create_superuser.py && python /HomeMoneyManagement/manage.py runserver 0.0.0.0:8000"
    ports:
      - 8000:8000
    volumes:
      - media_files:/HomeMoneyManagement/media
    depends_on:
      postgres:
        condition: service_healthy
  # Production command:
  # python /HomeMoneyManagement/manage.py migrate &&
  # gunicorn --bind 0.0.0.0:8000 --workers=4 MoneyManagement.wsgi:application
  money-management-ui:
    hostname: money-management-ui
    container_name: money-management-ui
    build: ./UI/home-money-management
    ports:
      - 8080:80
    depends_on:
      - money-management-api

volumes:
  postgres_data:
  media_files:
