server {
    listen 80;
    server_name _;
    # Keep the proxy limit aligned with the 10 MB PDF validation in the UI and API.
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits uncompressed text assets; gzip them on the wire (JS/CSS/HTML
    # are the bulk of the page). Images/fonts are already compressed.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml+svg;

    location /api/ {
        set $api_upstream money-management-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        # Statement extraction can span a transient Gemini retry and a model
        # fallback, so it must outlive Nginx's 60-second default.
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        set $api_upstream money-management-api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The HTML entry point names every Vite chunk. Never let a browser retain
    # an old entry point after a deployment, otherwise it asks for removed
    # hashed chunks and receives the SPA fallback HTML instead of JavaScript.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # A missing old chunk must be a real 404, never index.html with an HTML
    # MIME type. Existing content-hashed assets are safe to cache indefinitely.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
